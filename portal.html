<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DriveSQ Portal"/>
<meta name="theme-color" content="#080808"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="manifest" href="/portal-manifest.json"/>
<link rel="apple-touch-icon" href="https://i.postimg.cc/sx8zRRKV/cropped-circle-image.png"/>
<link rel="icon" type="image/png" href="https://i.postimg.cc/sx8zRRKV/cropped-circle-image.png"/>
<title>DriveSQ Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --red:#D10A11;--gold:#F5C518;--green:#25D366;--trans:.2s ease;
  --blk:#080808;--dk:#0f0f0f;--dk2:#161616;--dk3:#1e1e1e;--bdr:#2a2a2a;
  --txt:#f0f0f0;--txt2:#aaa;--txt3:#666;--txt4:#333;
  --card:#161616;--nav:rgba(8,8,8,.98);--inp:#181818;--shadow:rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--blk);color:var(--txt);font-family:'Inter',sans-serif;min-height:100dvh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;line-height:1.05}
a{color:var(--red);text-decoration:none}
img{max-width:100%}
button{font-family:'Inter',sans-serif;cursor:pointer}
input,select,textarea{font-family:'Inter',sans-serif}
.hidden{display:none!important}

/* ── SPLASH / LOADING ── */
#splash{position:fixed;inset:0;background:var(--blk);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:18px;transition:opacity .4s}
#splash.fade{opacity:0;pointer-events:none}
.splash-logo{width:80px;height:80px;border-radius:50%;border:3px solid var(--red);object-fit:cover;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(209,10,17,.4)}50%{box-shadow:0 0 0 14px rgba(209,10,17,0)}}
.splash-title{font-family:'Oswald',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:1px;color:var(--txt)}
.splash-title span{color:var(--red)}
.splash-sub{font-size:.65rem;text-transform:uppercase;letter-spacing:2.5px;color:var(--txt3)}
.splash-spinner{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN SCREEN ── */
#loginScreen{display:none;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#loginScreen.active{display:flex}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:32px 28px}
.login-logo-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px}
.login-logo{width:64px;height:64px;border-radius:50%;border:2px solid var(--red);object-fit:cover}
.login-title{font-family:'Oswald',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.5px;text-align:center}
.login-title span{color:var(--red)}
.login-sub{font-size:.7rem;color:var(--txt3);letter-spacing:1.5px;text-transform:uppercase}
.l-label{font-size:.7rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:5px;font-weight:600}
.l-inp{width:100%;background:var(--inp);border:1.5px solid var(--bdr);border-radius:10px;padding:11px 14px;color:var(--txt);font-size:.9rem;outline:none;transition:border-color var(--trans);margin-bottom:14px}
.l-inp:focus{border-color:var(--red)}
.l-btn{width:100%;background:var(--red);border:none;color:#fff;border-radius:12px;padding:13px;font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.5px;transition:opacity var(--trans);margin-top:4px}
.l-btn:hover{opacity:.88}
.l-btn:disabled{opacity:.5;cursor:not-allowed}
.l-err{font-size:.78rem;color:#f87171;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:8px;padding:9px 12px;margin-bottom:12px;display:none}
.l-err.show{display:block}
.l-link{font-size:.75rem;color:var(--txt3);text-align:center;margin-top:14px}
.l-link a{color:var(--red)}

/* ── ROLE SELECTOR ── */
#roleScreen{display:none;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px}
#roleScreen.active{display:flex}
.role-card{width:100%;max-width:380px;background:var(--card);border:2px solid var(--bdr);border-radius:18px;padding:22px 24px;display:flex;align-items:center;gap:16px;transition:border-color var(--trans),background var(--trans)}
.role-card:hover{border-color:var(--red);background:rgba(209,10,17,.05)}
.role-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.role-title{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;color:var(--txt)}
.role-desc{font-size:.72rem;color:var(--txt3);margin-top:2px}
.role-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:6px;padding:2px 8px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}

/* ── MAIN APP ── */
#app{display:none;flex-direction:column;min-height:100dvh}
#app.active{display:flex}

/* Top nav */
.p-nav{background:var(--nav);border-bottom:2px solid var(--red);position:sticky;top:0;z-index:200;backdrop-filter:blur(16px);padding:0 16px;height:54px;display:flex;align-items:center;gap:10px}
.p-nav-logo{width:32px;height:32px;border-radius:50%;border:2px solid var(--red);object-fit:cover;flex-shrink:0}
.p-brand{flex:1}
.p-brand-n{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.5px;line-height:1}
.p-brand-n span{color:var(--red)}
.p-brand-s{font-size:.45rem;color:var(--txt3);letter-spacing:2px;text-transform:uppercase}
.p-nav-btn{background:transparent;border:1px solid var(--bdr);color:var(--txt3);border-radius:8px;padding:5px 9px;min-height:34px;min-width:34px;display:flex;align-items:center;justify-content:center;font-size:.82rem;transition:all var(--trans)}
.p-nav-btn:hover{border-color:var(--red);color:var(--txt)}
.p-role-chip{font-size:.58rem;background:rgba(245,197,24,.12);color:var(--gold);border:1px solid rgba(245,197,24,.3);border-radius:5px;padding:2px 7px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}

/* Iframe container */
#frameWrap{flex:1;position:relative;overflow:hidden}
#frameWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}

/* Bottom tab bar */
.p-tabbar{background:var(--nav);border-top:1px solid var(--bdr);display:flex;align-items:stretch;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);position:sticky;bottom:0;z-index:200}
.p-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);border:none;background:transparent;transition:color var(--trans);padding:6px 0;position:relative}
.p-tab i{font-size:1.15rem;transition:color var(--trans)}
.p-tab.active{color:var(--red)}
.p-tab.active i{color:var(--red)}
.p-tab:hover{color:var(--txt)}

/* Loading overlay on iframe switch */
.frame-loader{position:absolute;inset:0;background:var(--blk);display:flex;align-items:center;justify-content:center;z-index:10;transition:opacity .3s}
.frame-loader.done{opacity:0;pointer-events:none}

/* Toast */
#portalToast{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--dk2);border:1px solid var(--bdr);border-radius:10px;padding:10px 18px;font-size:.82rem;color:var(--txt);z-index:9000;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none}
#portalToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Logout confirm */
#logoutMenu{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:5000;padding:0 0 env(safe-area-inset-bottom)}
#logoutMenu.open{display:flex}
.logout-sheet{background:var(--dk2);border:1px solid var(--bdr);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.logout-title{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;margin-bottom:6px}
.logout-sub{font-size:.78rem;color:var(--txt3);margin-bottom:18px}
.logout-btn-danger{width:100%;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#f87171;border-radius:10px;padding:12px;font-weight:600;font-size:.88rem;margin-bottom:8px;transition:all var(--trans)}
.logout-btn-danger:hover{background:rgba(248,113,113,.2)}
.logout-btn-cancel{width:100%;background:var(--card);border:1px solid var(--bdr);color:var(--txt3);border-radius:10px;padding:12px;font-weight:600;font-size:.88rem;transition:all var(--trans)}
.logout-btn-cancel:hover{background:var(--dk3)}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <img class="splash-logo" src="https://i.postimg.cc/sx8zRRKV/cropped-circle-image.png" alt="DriveSQ"/>
  <div>
    <div class="splash-title">Drive<span>SQ</span> <span style="color:var(--txt)">Portal</span></div>
    <div class="splash-sub" style="text-align:center">Your Driving School App</div>
  </div>
  <div class="splash-spinner"></div>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo-row">
      <img class="login-logo" src="https://i.postimg.cc/sx8zRRKV/cropped-circle-image.png" alt="DriveSQ"/>
      <div>
        <div class="login-title">Drive<span>SQ</span> Portal</div>
        <div class="login-sub">Sign in to continue</div>
      </div>
    </div>
    <div id="loginErr" class="l-err"></div>
    <label class="l-label">Email</label>
    <input id="loginEmail" class="l-inp" type="email" placeholder="you@example.com" autocomplete="email"/>
    <label class="l-label">Password</label>
    <input id="loginPass" class="l-inp" type="password" placeholder="••••••••" autocomplete="current-password"/>
    <button class="l-btn" id="loginBtn" onclick="doLogin()"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
    <div class="l-link">Forgot password? <a href="mailto:info@drivesq.co.uk">Contact DriveSQ</a></div>
  </div>
</div>

<!-- ROLE SELECT -->
<div id="roleScreen">
  <div style="text-align:center;margin-bottom:8px">
    <div style="font-family:'Oswald',sans-serif;font-size:1.2rem;font-weight:700">Choose your portal</div>
    <div style="font-size:.72rem;color:var(--txt3);margin-top:4px">Signed in as <span id="roleEmail" style="color:var(--txt)"></span></div>
  </div>
  <button class="role-card" onclick="launchPortal('dashboard')">
    <div class="role-icon" style="background:rgba(209,10,17,.12)">🎓</div>
    <div>
      <div class="role-title">Instructor Dashboard</div>
      <div class="role-desc">Manage referrals, students, accounting & more</div>
    </div>
    <div class="role-badge">Instructor</div>
  </button>
  <button class="role-card" onclick="launchPortal('student')">
    <div class="role-icon" style="background:rgba(245,197,24,.12)">🚗</div>
    <div>
      <div class="role-title">Student Portal</div>
      <div class="role-desc">Your lessons, progress, theory prep & bookings</div>
    </div>
    <div class="role-badge" style="background:var(--gold);color:#000">Student</div>
  </button>
  <button onclick="doLogout()" style="font-size:.75rem;color:var(--txt3);background:transparent;border:none;margin-top:8px">
    <i class="bi bi-box-arrow-left me-1"></i>Sign out
  </button>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- Top nav -->
  <nav class="p-nav">
    <img class="p-nav-logo" src="https://i.postimg.cc/sx8zRRKV/cropped-circle-image.png" alt="DriveSQ"/>
    <div class="p-brand">
      <div class="p-brand-n">Drive<span>SQ</span> Portal</div>
      <div class="p-brand-s" id="portalRoleLabel">Loading…</div>
    </div>
    <span class="p-role-chip" id="portalRoleChip"></span>
    <button class="p-nav-btn" onclick="switchPortal()" title="Switch portal">
      <i class="bi bi-arrow-left-right"></i>
    </button>
    <button class="p-nav-btn" onclick="openLogoutMenu()" title="Sign out">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </nav>

  <!-- Iframe area -->
  <div id="frameWrap">
    <div class="frame-loader" id="frameLoader">
      <div class="splash-spinner"></div>
    </div>
    <iframe id="portalFrame" title="DriveSQ Portal" allowfullscreen></iframe>
  </div>

  <!-- Bottom tab bar -->
  <div class="p-tabbar" id="tabBar">
    <!-- Tabs injected by JS based on role -->
  </div>
</div>

<!-- Logout sheet -->
<div id="logoutMenu" onclick="if(event.target===this)closeLogoutMenu()">
  <div class="logout-sheet">
    <div class="logout-title">Sign out?</div>
    <div class="logout-sub">You'll need to sign in again to access the portal.</div>
    <button class="logout-btn-danger" onclick="doLogout()"><i class="bi bi-box-arrow-right me-2"></i>Yes, sign out</button>
    <button class="logout-btn-cancel" onclick="closeLogoutMenu()">Cancel</button>
  </div>
</div>

<!-- Toast -->
<div id="portalToast"></div>

<script>
const SB_URL='https://vwvbfqrlumvoabzkjxoa.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3dmJmcXJsdW12b2FiemtqeG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzQ4MzgsImV4cCI6MjA5Njc1MDgzOH0.c5UNle-sh1DYuyqaNYvG9r9ru74EMP89uhdteQu2qho';
const sb=supabase.createClient(SB_URL,SB_KEY);

let _user=null;
let _activePortal=null; // 'dashboard' | 'student'

const PORTALS={
  dashboard:{
    url:'/dashboard.html',
    label:'Instructor Dashboard',
    chip:'Instructor',
    tabs:[
      {id:'home',icon:'bi-house-fill',label:'Home',hash:'#home'},
      {id:'referrals',icon:'bi-people-fill',label:'Referrals',hash:'#referrals'},
      {id:'accounting',icon:'bi-bar-chart-fill',label:'Accounts',hash:'#accounting'},
      {id:'waiting',icon:'bi-clock-fill',label:'Waitlist',hash:'#waiting'},
      {id:'profile',icon:'bi-person-fill',label:'Profile',hash:'#profile'},
    ]
  },
  student:{
    url:'/student.html',
    label:'Student Portal',
    chip:'Student',
    tabs:[
      {id:'home',icon:'bi-house-fill',label:'Home',hash:'#home'},
      {id:'lessons',icon:'bi-calendar-check-fill',label:'Lessons',hash:'#lessons'},
      {id:'progress',icon:'bi-trophy-fill',label:'Progress',hash:'#progress'},
      {id:'theory',icon:'bi-book-fill',label:'Theory',hash:'#theory'},
      {id:'profile',icon:'bi-person-fill',label:'Profile',hash:'#profile'},
    ]
  }
};

function showToast(msg,dur=2200){
  const t=document.getElementById('portalToast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

function showScreen(id){
  ['loginScreen','roleScreen','app'].forEach(s=>{
    const el=document.getElementById(s);
    el.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}

// ── AUTH ──
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  errEl.classList.remove('show');
  if(!email||!pass){errEl.textContent='Please enter your email and password.';errEl.classList.add('show');return;}
  btn.disabled=true;btn.textContent='Signing in…';
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;btn.innerHTML='<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
  if(error){errEl.textContent=error.message;errEl.classList.add('show');return;}
  _user=data.user;
  onSignedIn();
}

function onSignedIn(){
  // Check saved role preference
  const saved=localStorage.getItem('dsq_portal_role');
  document.getElementById('roleEmail').textContent=_user.email;
  if(saved&&PORTALS[saved]){
    launchPortal(saved);
  } else {
    showScreen('roleScreen');
  }
  hideSplash();
}

async function doLogout(){
  closeLogoutMenu();
  await sb.auth.signOut();
  _user=null;_activePortal=null;
  localStorage.removeItem('dsq_portal_role');
  document.getElementById('portalFrame').src='';
  showScreen('loginScreen');
  showToast('Signed out ✓');
}

function openLogoutMenu(){document.getElementById('logoutMenu').classList.add('open');}
function closeLogoutMenu(){document.getElementById('logoutMenu').classList.remove('open');}

// ── PORTAL LAUNCH ──
function launchPortal(role){
  _activePortal=role;
  localStorage.setItem('dsq_portal_role',role);
  const p=PORTALS[role];

  // Nav labels
  document.getElementById('portalRoleLabel').textContent=p.label;
  document.getElementById('portalRoleChip').textContent=p.chip;

  // Build tab bar
  const tabBar=document.getElementById('tabBar');
  tabBar.innerHTML=p.tabs.map(t=>`
    <button class="p-tab" id="ptab-${t.id}" onclick="navTab('${role}','${t.id}','${t.hash}')">
      <i class="bi ${t.icon}"></i>${t.label}
    </button>`).join('');

  // Show app screen
  showScreen('app');

  // Load iframe
  const frame=document.getElementById('portalFrame');
  const loader=document.getElementById('frameLoader');
  loader.classList.remove('done');
  frame.onload=()=>{loader.classList.add('done');};
  frame.src=p.url;

  // Mark first tab active
  setTimeout(()=>setActiveTab(p.tabs[0].id),100);
}

function navTab(role,tabId,hash){
  setActiveTab(tabId);
  const frame=document.getElementById('portalFrame');
  try{
    // Try to navigate within the loaded page via hash
    if(frame.contentWindow&&frame.contentWindow.location){
      const base=frame.contentWindow.location.href.split('#')[0];
      frame.contentWindow.location.hash=hash.replace('#','');
    }
  }catch(e){
    // Cross-origin or not ready — just reload with hash
    frame.src=PORTALS[role].url+hash;
  }
}

function setActiveTab(id){
  document.querySelectorAll('.p-tab').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('ptab-'+id);
  if(btn)btn.classList.add('active');
}

function switchPortal(){
  showScreen('roleScreen');
  document.getElementById('roleEmail').textContent=_user?.email||'';
}

// ── INIT ──
function hideSplash(){
  const sp=document.getElementById('splash');
  sp.classList.add('fade');
  setTimeout(()=>sp.style.display='none',400);
}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    _user=session.user;
    onSignedIn();
  } else {
    showScreen('loginScreen');
    hideSplash();
  }

  // Listen for auth changes
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){_user=null;_activePortal=null;showScreen('loginScreen');}
  });

  // Enter on login fields
  ['loginEmail','loginPass'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  });
}

init();
</script>
</body>
</html>
