<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DriveSQ Theory"/>
<meta name="theme-color" content="#080808"/>
<meta name="description" content="Free UK driving theory test practice — 700 original questions across 8 topics, 14 full mock exams, streaks and progress tracking. No sign-up required to start, no paywall, ever."/>
<link rel="canonical" href="https://theory.drivesq.co.uk/"/>
<link rel="manifest" href="/theory-app/manifest.json"/>
<link rel="apple-touch-icon" href="https://i.postimg.cc/sx8zRRKV/cropped-circle-image.png"/>
<link rel="icon" type="image/png" href="https://i.postimg.cc/sx8zRRKV/cropped-circle-image.png"/>
<title>DriveSQ Theory — Free UK Driving Theory Test Practice</title>
<meta property="og:title" content="DriveSQ Theory — Free UK Driving Theory Test Practice"/>
<meta property="og:description" content="700 original questions, 14 full mock exams, streaks and progress tracking. Completely free."/>
<meta property="og:type" content="website"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">DQ</div>
      <div class="brand-name">DriveSQ <b>Theory</b></div>
    </div>
    <div class="topbar-actions">
      <div class="stat-pill streak" id="streakPill"><i class="bi bi-fire"></i>0</div>
      <div class="stat-pill xp" id="xpPill"><i class="bi bi-lightning-charge-fill"></i>0</div>
    </div>
  </div>
</div>

<div class="app-wrap" id="appRoot"></div>

<div class="bottom-nav">
  <button class="bn-item" id="bn-home" onclick="quiz=null;nav('home')"><i class="bi bi-map-fill"></i><span>Route</span></button>
  <button class="bn-item" id="bn-mocks" onclick="quiz=null;nav('mocks')"><i class="bi bi-clipboard-check-fill"></i><span>Mocks</span></button>
  <button class="bn-item" id="bn-profile" onclick="quiz=null;nav('profile')"><i class="bi bi-person-circle"></i><span>Profile</span></button>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="authOverlay">
  <div class="sheet">
    <div id="authBody">
      <div class="sheet-handle"></div>
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:1.1rem">Sign in — it's free</div>
        <div style="color:var(--txt3);font-size:.8rem;margin-top:2px">No password. We'll email you a one-tap link.</div>
      </div>
      <div class="auth-field">
        <label>Email address</label>
        <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <button class="btn btn-primary btn-block" id="authSendBtn" onclick="sendMagicLink()">Send sign-in link</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeAuth()">Not now</button>
    </div>
  </div>
</div>

<div class="overlay" id="levelUpOverlay">
  <div class="sheet" id="levelUpBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="theory-questions.js"></script>
<script src="app.js"></script>
</body>
</html>
